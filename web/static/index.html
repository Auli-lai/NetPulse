<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetPulse — 网络诊断 Agent</title>
<!-- 内联 favicon：不写的话浏览器会去要 /favicon.ico，控制台里留一条 404。
     用 data URI 而不是外部文件，是为了保持"零外部请求、可完全离线" -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232a78d6'/><path d='M7 20l5-6 5 4 8-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
/* ==========================================================================
   配色
   --------------------------------------------------------------------------
   状态色（good / warning / critical）取自一套经过校验的固定状态色板，
   不做主题化 —— 语义色换主题会让人认不出来。

   ⚠️ 两条硬规则，写在最前面免得后面忘：
     1. 状态**永远不能只靠颜色表达** —— 每个状态标记旁边必须有图标和文字。
        （红绿对色盲用户不可分，颜色只是加速识别，不是唯一信息通道）
     2. 低对比度的状态色（warning 在浅色背景上只有 1.79:1）**只能当标记和
        边框用，不能当文字颜色** —— 文字一律用 text token。
   ========================================================================== */
:root {
  color-scheme: light;

  --plane:          #f9f9f7;   /* 页面底色 */
  --surface:        #fcfcfb;   /* 卡片 */
  --surface-2:      #f2f2ef;   /* 次级卡片 / 代码块 */
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --border:         rgba(11,11,11,0.10);
  --gridline:       #e1e0d9;
  --baseline:       #c3c2b7;

  --accent:         #2a78d6;   /* 模型活动（分类色板 1 号槽） */
  --accent-soft:    rgba(42,120,214,0.10);

  /* 状态色：固定，不随主题变 */
  --good:           #0ca30c;
  --warning:        #fab219;
  --critical:       #d03b3b;
  --good-text:      #006300;   /* 状态色当文字用时的替身（对比度够） */
  --critical-text:  #b02a2a;

  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane:          #0d0d0d;
    --surface:        #1a1a19;
    --surface-2:      #232322;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:         rgba(255,255,255,0.10);
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --accent:         #3987e5;
    --accent-soft:    rgba(57,135,229,0.16);
    --good-text:      #0ca30c;
    --critical-text:  #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:          #0d0d0d;
  --surface:        #1a1a19;
  --surface-2:      #232322;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --border:         rgba(255,255,255,0.10);
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --accent:         #3987e5;
  --accent-soft:    rgba(57,135,229,0.16);
  --good-text:      #0ca30c;
  --critical-text:  #e66767;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--text-primary);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  /* 整体用 flex 纵向布局：顶栏 / 主区 / 底部输入栏，占满视口高度 */
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- 顶栏 ---------- */
header {
  flex: none;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; border-bottom: 1px solid var(--border);
}
h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--text-muted); font-size: 12px; }
.spacer { flex: 1; }
button {
  font: inherit; cursor: pointer; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-secondary); padding: 6px 12px;
  transition: background .12s, color .12s;
}
button:hover { background: var(--surface-2); color: var(--text-primary); }
button.primary {
  background: var(--accent); color: #fff; border-color: transparent;
  font-weight: 600; padding: 9px 20px;
}
button.primary:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- 主布局：左历史侧栏 + 右主区 ---------- */
.layout { flex: 1 1 auto; display: flex; min-height: 0; }

.sidebar {
  flex: 0 0 240px; width: 240px;
  border-right: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto; padding: 14px 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.sidebar-head { display: flex; align-items: center; justify-content: space-between; }
.sidebar-head .stitle { font-weight: 600; font-size: 13px; }
.sidebar-head .sbtns { display: flex; gap: 6px; }
.sidebar-head button { font-size: 12px; padding: 4px 9px; }
#refreshRuns { font-size: 13px; padding: 4px 8px; line-height: 1; }

.runlist { display: flex; flex-direction: column; gap: 8px; }
.runitem {
  text-align: left; background: var(--plane); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; cursor: pointer; font: inherit;
  color: var(--text-primary); width: 100%;
}
.runitem:hover { background: var(--surface-2); }
.runitem.active { border-color: var(--accent); background: var(--accent-soft); }
.ritem-top { margin-bottom: 3px; }
.rstatus { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); }
.st-ok  { color: var(--good-text); border-color: var(--good); }
.st-err { color: var(--critical-text); border-color: var(--critical); }
.st-live{ color: var(--accent); border-color: var(--accent); }
.rq { font-size: 12.5px; line-height: 1.4; margin-bottom: 2px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rmeta { font-size: 11px; color: var(--text-muted); }
.runempty { color: var(--text-muted); font-size: 12px; padding: 8px 2px; line-height: 1.5; }

.content { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.content-scroll { flex: 1 1 auto; overflow-y: auto; padding: 16px 20px 24px; }

/* ---------- 本次问题横幅 ---------- */
.qbanner {
  display: flex; gap: 10px; background: var(--surface);
  border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px;
}
.qbanner .qicon { color: var(--accent); font-weight: 700; }
.qlabel { font-size: 11px; color: var(--text-muted); }
.qtext { font-size: 14px; font-weight: 600; margin-top: 2px; }
.qmeta { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: var(--mono); }

/* ---------- 状态条 ---------- */
.status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-muted); min-height: 20px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); flex: none; }
.dot.live { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.dot.ok   { background: var(--good); }
.dot.err  { background: var(--critical); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

/* ---------- KPI 行 ---------- */
.kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 4px; }
.kpi {
  flex: 1 1 120px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
}
.kpi .label { font-size: 12px; color: var(--text-muted); }
.kpi .value { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
.kpi .value small { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }

/* ---------- 独立面板（思考 / 工具 / 记忆 / SSE） ---------- */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-top: 14px; overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; font-weight: 600; font-size: 13px;
  cursor: pointer; user-select: none; border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.panel-head .chev { transition: transform .15s; display: inline-block; color: var(--text-muted); }
.panel-head.collapsed .chev { transform: rotate(-90deg); }
.panel-head .ptitle { display: flex; align-items: center; gap: 7px; }
.pcount {
  margin-left: auto; font-size: 11px; color: var(--text-muted);
  background: var(--surface-2); border-radius: 999px; padding: 1px 9px; font-weight: 500;
}
.rawtoggle {
  margin-left: auto; font-weight: 400; font-size: 11px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 4px; cursor: pointer;
}
.rawtoggle input { margin: 0; }
.panel-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.panel-body.collapsed { display: none; }

/* ---------- 事件卡片（面板内复用） ---------- */
.card {
  background: var(--plane); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
}
.card.answer { border-left: 3px solid var(--accent); }
.evhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.icon { font-size: 13px; flex: none; }
.name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
.tag {
  font-size: 11px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-secondary);
}
.tag.good { color: var(--good-text); border-color: var(--good); }
.tag.err  { color: var(--critical-text); border-color: var(--critical); }
.tag.warn { color: var(--text-secondary); border-color: var(--warning); }
.ms { font-size: 11px; color: var(--text-muted); margin-left: auto; font-variant-numeric: tabular-nums; }

.thought-text { color: var(--text-secondary); white-space: pre-wrap; word-break: break-word; }
.args { font-family: var(--mono); font-size: 12px; color: var(--text-muted); margin-top: 6px; word-break: break-word; }

details { margin-top: 8px; }
summary {
  cursor: pointer; font-size: 12px; color: var(--text-muted);
  list-style: none; user-select: none;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸ "; }
details[open] summary::before { content: "▾ "; }
pre {
  background: var(--surface-2); border-radius: 8px; padding: 10px 12px;
  overflow-x: auto; font-family: var(--mono); font-size: 11.5px;
  line-height: 1.5; margin: 8px 0 0; max-height: 340px;
  font-variant-numeric: tabular-nums;   /* 表格/JSON 列要对齐，这里用等宽数字 */
  white-space: pre-wrap; word-break: break-word;
}

/* 工具失败/被拦截时直接显示的原因块 */
.errmsg {
  margin-top: 8px; padding: 8px 10px; border-radius: 8px;
  background: var(--surface-2); border-left: 3px solid var(--critical);
  font-size: 12px; color: var(--text-secondary);
  white-space: pre-wrap; word-break: break-word;
}
.errmsg.warn-msg { border-left-color: var(--warning); }
.errmsg .muted { color: var(--text-muted); }

/* 原始 SSE 事件流里的每一行 */
.sseline {
  font-family: var(--mono); font-size: 11px; color: var(--text-secondary);
  padding: 3px 0; border-bottom: 1px dashed var(--border);
}
.sseline:last-child { border-bottom: none; }
.sseline .sset { color: var(--text-muted); }
.sseline .sseq { color: var(--accent); }
.skind { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }
.k-thought, .k-final        { color: var(--accent); border-color: var(--accent); }
.k-tool_result              { color: var(--good-text); border-color: var(--good); }
.k-memory_recall            { color: #8a5cd1; border-color: #8a5cd1; }
.k-error                    { color: var(--critical-text); border-color: var(--critical); }
.k-done, .k-finish, .k-forcing_conclusion { color: var(--text-muted); }

/* ---------- 结论的 markdown 渲染 ---------- */
.md h2 { font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
.md h2:first-child { margin-top: 0; }
.md p { margin: 6px 0; }
.md ul { margin: 6px 0; padding-left: 20px; }
.md li { margin: 2px 0; }
.md strong { font-weight: 600; }
.md code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2);
           padding: 1px 5px; border-radius: 4px; }

.empty { color: var(--text-muted); font-size: 12px; padding: 6px 0; }

/* 演示提示框 */
.hint {
  margin: 12px 0 0; padding: 10px 12px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--warning);
  font-size: 12px; color: var(--text-secondary); line-height: 1.65;
  white-space: pre-line;
}
.hint code {
  font-family: var(--mono); font-size: 11.5px;
  background: var(--surface-2); padding: 1px 4px; border-radius: 4px;
}
.hint button { font-size: 12px; padding: 3px 10px; margin-left: 8px; }

/* ---------- 底部输入栏 ---------- */
.bottombar {
  flex: none; border-top: 1px solid var(--border); background: var(--surface);
  padding: 10px 20px 14px;
}
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.chip {
  font-size: 12px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--plane);
  color: var(--text-secondary); cursor: pointer;
}
.chip:hover { color: var(--text-primary); background: var(--surface-2); }
.inputbar { display: flex; gap: 10px; }
input[type=text] {
  flex: 1; font: inherit; padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--plane);
  color: var(--text-primary);
}
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

/* 窄屏：侧栏收窄，避免挤占主区 */
@media (max-width: 720px) {
  .sidebar { flex-basis: 150px; width: 150px; }
  .content-scroll { padding: 12px 12px 18px; }
  .bottombar { padding: 10px 12px 12px; }
}

/* 滚动条在深色下也别太刺眼 */
.sidebar::-webkit-scrollbar, .content-scroll::-webkit-scrollbar { width: 10px; }
.sidebar::-webkit-scrollbar-thumb, .content-scroll::-webkit-scrollbar-thumb {
  background: var(--baseline); border-radius: 6px; border: 2px solid var(--surface);
}
</style>
</head>
<body>

<header>
  <h1>NetPulse 网络诊断</h1>
  <span class="sub">eBPF 采集 · 混合检索 · ReAct Agent</span>
  <span class="spacer"></span>
  <button id="demo" aria-pressed="false"
          title="用假模型 + 假工具跑，不需要 API Key、不需要 C++ 服务">演示模式</button>
  <button id="theme" title="切换主题">◐ 自动</button>
</header>

<div class="layout">
  <!-- 左：历史对话侧栏 -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <span class="stitle">诊断历史</span>
      <span class="sbtns">
        <button id="refreshRuns" title="刷新列表">↻</button>
        <button id="newRun" title="清空当前视图，开始新的诊断">＋ 新建</button>
      </span>
    </div>
    <div class="runlist" id="runlist"></div>
  </aside>

  <!-- 右：主区 -->
  <main class="content">
    <div class="content-scroll" id="contentScroll">

      <div class="qbanner" id="qbanner" hidden>
        <span class="qicon">❯</span>
        <div>
          <div class="qlabel">本次问题</div>
          <div class="qtext" id="qtext"></div>
          <div class="qmeta" id="qmeta"></div>
        </div>
      </div>

      <div class="status"><span class="dot" id="dot"></span><span id="statusText">就绪</span></div>

      <div class="kpis" id="kpis" hidden></div>

      <!-- 面板一：推理思考 -->
      <section class="panel">
        <div class="panel-head" data-body="thoughtBody">
          <span class="chev">▾</span>
          <span class="ptitle"><span class="icon">💭</span> 推理思考</span>
          <span class="pcount" id="cntThought">0</span>
        </div>
        <div class="panel-body" id="thoughtBody">
          <div class="empty">还没有推理过程…</div>
        </div>
      </section>

      <!-- 面板二：工具调用 -->
      <section class="panel">
        <div class="panel-head" data-body="toolBody">
          <span class="chev">▾</span>
          <span class="ptitle"><span class="icon">🔧</span> 工具调用</span>
          <span class="pcount" id="cntTool">0</span>
        </div>
        <div class="panel-body" id="toolBody">
          <div class="empty">还没有工具调用…</div>
        </div>
      </section>

      <!-- 面板三：记忆回忆 -->
      <section class="panel">
        <div class="panel-head" data-body="memoryBody">
          <span class="chev">▾</span>
          <span class="ptitle"><span class="icon">🧠</span> 记忆回忆</span>
          <span class="pcount" id="cntMemory">0</span>
        </div>
        <div class="panel-body" id="memoryBody">
          <div class="empty">没有调用过往记忆…</div>
        </div>
      </section>

      <!-- 面板四：原始 SSE 事件流 -->
      <section class="panel">
        <div class="panel-head" data-body="sseBody">
          <span class="chev">▾</span>
          <span class="ptitle"><span class="icon">📡</span> 原始 SSE 事件流</span>
          <label class="rawtoggle" id="rawToggle">显示原始报文
            <input type="checkbox" id="sseRaw"></label>
          <span class="pcount" id="cntSSE">0</span>
        </div>
        <div class="panel-body" id="sseBody">
          <div class="empty">连接后，这里实时显示收到的每一个 SSE 事件（类型 · 序号 · 字节数）…</div>
        </div>
      </section>

    </div>
  </main>
</div>

<!-- 底部：示例 + 输入栏 -->
<div class="bottombar">
  <div class="examples" id="examples"></div>
  <div class="inputbar">
    <input type="text" id="q" placeholder="用一句话描述你遇到的网络问题…" autocomplete="off">
    <button class="primary" id="go">诊断</button>
    <button class="primary" id="stop" hidden>停止</button>
  </div>
</div>

<script>
"use strict";

/* ==========================================================================
   为什么要先 escape 再渲染
   --------------------------------------------------------------------------
   页面里显示的文本有两个来源：模型生成的结论、工具返回的数据。
   **两个都不能信** —— 工具返回的内容最终来自网络数据（连接明细里有对端 IP
   之类），模型输出更是不可控。

   直接 innerHTML 就等于把这些内容当代码执行。所以渲染前一律转义，
   再对**转义后**的文本做轻量 markdown 处理。
   ========================================================================== */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* 极简 markdown：只处理 ## 标题、**粗体**、- 列表、`代码`。
   故意不引第三方库（页面要求零外部依赖），也不追求完整 ——
   模型输出的是固定格式的诊断结论，这几种够了。 */
function md(text) {
  const lines = esc(text).split("\n");
  let out = [], list = false;
  const inline = (s) => s
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`(.+?)`/g, "<code>$1</code>");

  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^#{1,6}\s+/.test(line)) {
      if (list) { out.push("</ul>"); list = false; }
      out.push("<h2>" + inline(line.replace(/^#{1,6}\s+/, "")) + "</h2>");
    } else if (/^\s*[-·*]\s+/.test(line)) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push("<li>" + inline(line.replace(/^\s*[-·*]\s+/, "")) + "</li>");
    } else if (/^\s*\d+[.、]\s+/.test(line)) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push("<li>" + inline(line.replace(/^\s*\d+[.、]\s+/, "")) + "</li>");
    } else if (line === "") {
      if (list) { out.push("</ul>"); list = false; }
    } else {
      if (list) { out.push("</ul>"); list = false; }
      out.push("<p>" + inline(line) + "</p>");
    }
  }
  if (list) out.push("</ul>");
  return out.join("");
}

/* ---------- 主题 ---------- */
const THEMES = ["auto", "light", "dark"];
let themeIdx = 0;
const themeBtn = document.getElementById("theme");
themeBtn.onclick = () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  const t = THEMES[themeIdx];
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = "◐ " + (t === "auto" ? "自动" : t === "light" ? "浅色" : "深色");
};

/* ---------- 演示模式 ----------
   没有它的话，第一次打开页面必须先把 API Key、C++ 服务、RAG 索引全配齐，
   否则一点"诊断"看到的就是一句报错。而演示模式用假模型 + 假工具，
   零配置就能把整条推理链和界面演一遍 —— 这对演示和录屏很关键：
   **演示不该依赖一堆现场才能配好的东西。** */
let demoOn = new URLSearchParams(location.search).has("demo");
const demoBtn = document.getElementById("demo");
function renderDemoBtn() {
  demoBtn.setAttribute("aria-pressed", String(demoOn));
  demoBtn.textContent = demoOn ? "演示模式 · 开" : "演示模式";
}
demoBtn.onclick = () => { demoOn = !demoOn; renderDemoBtn(); };
renderDemoBtn();

/* 启动时探一下环境，缺东西就直接告诉用户 —— 而不是等他点了诊断才报错。
 *
 * ⚠️ 这里用服务端返回的 `hints`，**不在前端自己拼原因**。
 * 第一版是在前端判断的，会把"没装 dbus-python"和"服务没在跑"归成同一句话，
 * 于是明明只是少装一个 apt 包，却显示成"你的 C++ 服务没启动"。
 * 原因判断放在服务端（那里知道原始错误），前端只负责显示。 */
fetch("/api/health").then((r) => r.json()).then((h) => {
  const hints = h.hints || [];
  if (hints.length && !demoOn) {
    const box = document.createElement("div");
    box.className = "hint";
    box.innerHTML =
      "<b>环境检查</b>\n" +
      hints
        .map((t) => "· " + esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"))
        .join("\n") +
      `\n\n<button id="hintDemo">打开演示模式（不用配环境）</button>`;
    document.querySelector(".status").after(box);
    document.getElementById("hintDemo").onclick = () => {
      demoOn = true; renderDemoBtn(); box.remove();
    };
  }
}).catch(() => {});

/* ---------- 示例问题 ---------- */
const EXAMPLES = [
  "网络很卡，帮我看看是什么问题",
  "eth0 最近是不是有问题",
  "10:02 前后发生了什么",
  "WiFi 信号弱该怎么处理",
];
const exBox = document.getElementById("examples");
EXAMPLES.forEach((q) => {
  const b = document.createElement("span");
  b.className = "chip";
  b.textContent = q;
  b.onclick = () => { document.getElementById("q").value = q; go(); };
  exBox.appendChild(b);
});

/* ---------- 界面元素 ---------- */
const qEl = document.getElementById("q");
const goBtn = document.getElementById("go");
const stopBtn = document.getElementById("stop");
const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");
const kpis = document.getElementById("kpis");
const sseRawChk = document.getElementById("sseRaw");

function setStatus(kind, text) {
  dot.className = "dot" + (kind ? " " + kind : "");
  statusText.textContent = text;
}

/* rounds 由服务端的 finish 事件给出，**不在前端自己数**。
   一开始我在 thought 回调里 `roundNo++`，然后把它忘了 ——
   KPI 读的是 stats.rounds，于是页面上明明画了 5 轮思考，角标却显示 0。
   现在的做法是拿服务端的权威值，前端不重复计算。 */
const stats = { rounds: 0, toolCalls: 0, errors: 0, interventions: 0, serverMs: 0 };
let cntThought = 0, cntTool = 0, cntMemory = 0, cntSSE = 0;

/* 每个面板的空态文案（清空时恢复用） */
const EMPTY = {
  thoughtBody: "还没有推理过程…",
  toolBody:    "还没有工具调用…",
  memoryBody:  "没有调用过往记忆…",
  sseBody:     "连接后，这里实时显示收到的每一个 SSE 事件（类型 · 序号 · 字节数）…",
};

function resetPanels() {
  Object.keys(EMPTY).forEach((id) => {
    const b = document.getElementById(id);
    b.classList.remove("collapsed");
    b.innerHTML = '<div class="empty">' + EMPTY[id] + "</div>";
  });
  ["cntThought", "cntTool", "cntMemory", "cntSSE"].forEach((id) => {
    document.getElementById(id).textContent = "0";
  });
  cntThought = cntTool = cntMemory = cntSSE = 0;
  stats.rounds = stats.toolCalls = stats.errors = stats.interventions = stats.serverMs = 0;
  kpis.hidden = true;
}

function bump(id, n) {
  const el = document.getElementById(id);
  el.textContent = String((parseInt(el.textContent || "0", 10) || 0) + n);
}

/* 往某个面板里追加一张卡片；首次追加时清掉空态占位。 */
function addCard(bodyId, html) {
  const body = document.getElementById(bodyId);
  const empty = body.querySelector(".empty");
  if (empty) empty.remove();
  const wrap = document.createElement("div");
  wrap.innerHTML = html;
  const el = wrap.firstElementChild;
  body.appendChild(el);
  // 折叠的面板不抢滚动焦点；展开的面板把新内容带进可视区（就近滚动，不跳顶）
  if (!body.classList.contains("collapsed")) {
    el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  return el;
}

function setQuestion(q, meta) {
  document.getElementById("qbanner").hidden = false;
  document.getElementById("qtext").textContent = q;
  document.getElementById("qmeta").textContent = meta || "";
}

function showKpis(localElapsedMs) {
  // 用服务端报的耗时（它计的是真正的诊断时长）；
  // 前端测的是"从订阅到结束"，会漏掉请求往返那一段
  const ms = stats.serverMs || localElapsedMs;
  kpis.innerHTML = `
    <div class="kpi"><div class="label">推理轮次</div><div class="value">${stats.rounds}</div></div>
    <div class="kpi"><div class="label">工具调用</div><div class="value">${stats.toolCalls}</div></div>
    <div class="kpi"><div class="label">耗时</div><div class="value">${(ms / 1000).toFixed(1)}<small>s</small></div></div>
    <div class="kpi"><div class="label">工具报错</div><div class="value">${stats.errors}</div></div>
    <div class="kpi"><div class="label">被拦截的重复调用</div><div class="value">${stats.interventions}</div></div>`;
  kpis.hidden = false;
}

/* ---------- 事件 → 卡片 HTML ---------- */
function thoughtHtml(d) {
  return `<div class="card"><div class="evhead"><span class="icon">💭</span>
    <span class="name">第 ${d.round} 轮思考</span></div>
    <div class="thought-text" style="margin-top:4px">${esc(d.text)}</div></div>`;
}
function finalHtml(d) {
  return `<div class="card answer"><div class="evhead"><span class="icon">✓</span>
    <span class="name">诊断结论</span></div>
    <div class="md" style="margin-top:6px">${md(d.text)}</div></div>`;
}
function toolHtml(d) {
  const args = JSON.stringify(d.arguments || {});
  let cls = "good", icon = "🔧", tag = '<span class="tag good">成功</span>';
  if (d.intervention) {
    // 被容错机制拦截。这是**唯一能证明容错真的在工作**的地方，
    // 所以给它一个显眼但不刺眼的标记（warning + ⛔ + 文字说明）
    cls = "warn"; icon = "⛔";
    tag = `<span class="tag warn">已拦截</span>`;
  } else if (d.is_error) {
    cls = "error"; icon = "❌";
    tag = '<span class="tag err">失败</span>';
  }

  // 失败原因**直接显示出来**，不要藏在折叠面板里。
  // 原来错误信息只在"工具返回"的折叠区里，用户看到的是一行"失败"却不知道为什么 ——
  // 而工具失败恰恰是最需要解释的一件事（是环境没配？还是参数错了？）
  let extra = "";
  if (d.intervention) {
    extra = `<div class="errmsg warn-msg">
        ⛔ ${esc(d.intervention)}<br>
        <span class="muted">（模型重复调用了同一个工具，已被拦下并回灌提醒）</span></div>`;
  } else if (d.is_error) {
    let msg = "";
    try { msg = JSON.parse(d.raw || "{}").error || ""; } catch (_) { msg = d.raw || ""; }
    extra = `<div class="errmsg">❌ ${esc(msg || "调用失败，展开下方查看原始返回")}</div>`;
  }

  return `<div class="card">
      <div class="evhead"><span class="icon">${icon}</span>
        <span class="name">${esc(d.name)}</span>${tag}
        <span class="ms">${Math.round(d.elapsed_ms || 0)} ms</span></div>
      <div class="args">${esc(args)}</div>${extra}
      <details><summary>工具返回</summary><pre>${esc(d.raw || "")}</pre></details>
    </div>`;
}
function memoryHtml(d) {
  const items = (d.items || []).map((s) => "· " + esc(s)).join("<br>");
  return `<div class="card"><div class="evhead"><span class="icon">🧠</span>
    <span class="name">想起 ${d.count} 条过往诊断</span></div>
    <div style="margin-top:4px;color:var(--text-secondary);font-size:12px">${
      items || '<span class="muted">（无具体文本内容）</span>'}</div></div>`;
}
function errHtml(msg) {
  return `<div class="card"><div class="evhead"><span class="icon">⚠</span>
    <span class="name">出错了</span></div>
    <div style="margin-top:4px">${esc(msg)}</div></div>`;
}

/* ---------- 原始 SSE 事件流：把每一个到达的事件原样记下来 ---------- */
function logSSE(kind, raw, lastId) {
  const body = document.getElementById("sseBody");
  const empty = body.querySelector(".empty");
  if (empty) empty.remove();
  const line = document.createElement("div");
  line.className = "sseline";
  const d = new Date();
  const t = d.toLocaleTimeString("zh-CN", { hour12: false }) + "." +
            String(d.getMilliseconds()).padStart(3, "0");
  const id = lastId || "?";
  const nbytes = (raw || "").length;
  line.innerHTML =
    `<span class="sset">${esc(t)}</span> ` +
    `<span class="sseq">#${esc(String(id))}</span> ` +
    `<span class="skind k-${esc(kind)}">${esc(kind)}</span> ` +
    `<span class="sbytes">${nbytes}B</span>`;
  if (sseRawChk.checked) {
    const pre = document.createElement("pre");
    pre.textContent = raw;
    line.appendChild(pre);
  }
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
  bump("cntSSE", 1);
}

/* ==========================================================================
   历史对话：左侧侧栏列出 /api/runs，点击任意一条用 SSE 回放（since=0）
   --------------------------------------------------------------------------
   后端 Run.subscribe(since=0) 会**先回放完整历史事件再实时续传**，
   所以"看历史"和"看实时"用的是同一套 subscribe —— 不需要为历史单独写接口。
   ========================================================================== */
let activeRunId = null;
let runFinished = false;
let currentStream = null;
let startedAt = 0;

async function loadRuns() {
  try {
    const res = await fetch("/api/runs");
    const j = await res.json();
    const list = j.runs || [];
    const box = document.getElementById("runlist");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML =
        '<div class="runempty">还没有诊断记录。<br>在下方输入一个问题开始，或打开右上角「演示模式」。</div>';
      return;
    }
    list.forEach((r) => {
      const b = document.createElement("button");
      b.className = "runitem" + (r.run_id === activeRunId ? " active" : "");
      const status = r.done ? (r.error ? "失败" : "完成") : "进行中";
      const stCls = r.done ? (r.error ? "st-err" : "st-ok") : "st-live";
      const tc = (r.tool_calls == null ? 0 : r.tool_calls);
      const sec = ((r.elapsed_ms || 0) / 1000).toFixed(1);
      b.innerHTML =
        `<div class="ritem-top"><span class="rstatus ${stCls}">${status}</span></div>` +
        `<div class="rq">${esc(r.question)}</div>` +
        `<div class="rmeta">${tc} 次工具 · ${sec}s</div>`;
      b.onclick = () => openRun(r.run_id, r.question);
      box.appendChild(b);
    });
  } catch (_) {
    document.getElementById("runlist").innerHTML =
      '<div class="runempty">无法加载历史列表（服务可能未启动）。</div>';
  }
}

async function openRun(id, question) {
  if (currentStream) { currentStream.close(); currentStream = null; }
  runFinished = false;
  activeRunId = id;
  loadRuns();                       // 刷新高亮
  resetPanels();
  setQuestion(question || "(历史诊断)", "run_id: " + id);
  goBtn.disabled = false;
  goBtn.hidden = false;
  stopBtn.hidden = true;
  setStatus("live", "正在加载历史诊断…");
  subscribe(id, "replay");
}

/* ---------- 发起诊断 ---------- */
async function go() {
  const question = qEl.value.trim();
  if (!question) return;
  qEl.value = "";            // 提交后立即清空输入框，避免残留上一条问题

  // 误触防护：如果上一条诊断还在跑，先把它取消掉（再发一条就自动接管）
  if (activeRunId && !runFinished) {
    fetch("/api/diagnose/" + activeRunId + "/cancel", { method: "POST" }).catch(() => {});
  }

  if (currentStream) { currentStream.close(); currentStream = null; }
  runFinished = false;

  resetPanels();
  setQuestion(question, "新诊断");
  goBtn.disabled = true;
  goBtn.hidden = true;        // 运行中切到"停止"按钮
  stopBtn.hidden = false;
  setStatus("live", "正在诊断…");

  let runId;
  try {
    const res = await fetch("/api/diagnose", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, demo: demoOn }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    runId = (await res.json()).run_id;
  } catch (err) {
    setStatus("err", "发起失败：" + err.message);
    goBtn.disabled = false;
    return;
  }

  activeRunId = runId;
  loadRuns();                       // 把新 run 加进侧栏
  subscribe(runId, "live");
}

/* ---------- SSE 订阅（实时 + 历史回放共用） ---------- */
function subscribe(runId, mode) {
  // EventSource 断线会自动重连，并带上 Last-Event-ID —— 服务端据此续传，
  // 不会重跑诊断。详见 web/runstore.py 的说明。
  const es = new EventSource(`/api/diagnose/${runId}/stream`);
  currentStream = es;
  startedAt = performance.now();
  let wasCancelled = false;         // 本次订阅是否被用户中断

  const done = (extra) => {
    // 幂等：done 可能因 done 事件 + 传输关闭触发两次，只收一次
    if (runFinished) return;
    runFinished = true;
    if (currentStream) { currentStream.close(); currentStream = null; }
    goBtn.disabled = false;
    goBtn.hidden = false;           // 恢复"诊断"按钮
    stopBtn.hidden = true;
    showKpis(performance.now() - startedAt);
    if (wasCancelled) setStatus("", "已停止");
    else setStatus(extra || "ok", extra ? "诊断失败" : "完成");
    loadRuns();                     // 刷新历史侧栏（更新状态/耗时）
  };

  es.addEventListener("thought", (e) => {
    const d = JSON.parse(e.data);
    addCard("thoughtBody", thoughtHtml(d));
    bump("cntThought", 1);
    logSSE("thought", e.data, e.lastEventId);
  });

  es.addEventListener("tool_result", (e) => {
    const d = JSON.parse(e.data);
    stats.toolCalls++;
    if (d.intervention) stats.interventions++;
    else if (d.is_error) stats.errors++;
    addCard("toolBody", toolHtml(d));
    bump("cntTool", 1);
    logSSE("tool_result", e.data, e.lastEventId);
  });

  es.addEventListener("memory_recall", (e) => {
    const d = JSON.parse(e.data);
    addCard("memoryBody", memoryHtml(d));
    bump("cntMemory", 1);
    logSSE("memory_recall", e.data, e.lastEventId);
  });

  es.addEventListener("final", (e) => {
    const d = JSON.parse(e.data);
    addCard("thoughtBody", finalHtml(d));
    logSSE("final", e.data, e.lastEventId);
  });

  es.addEventListener("forcing_conclusion", () => {
    setStatus("live", "达到上限，正在用已有数据收尾…");
    logSSE("forcing_conclusion", "", "");
  });

  es.addEventListener("cancelled", () => {
    wasCancelled = true;
    setStatus("", "已停止");
    addCard("thoughtBody", '<div class="card k-done">⏹ 诊断已被你中断。</div>');
    logSSE("cancelled", "", "");
  });

  es.addEventListener("error", (e) => {
    // 传输层错误（EventSource 的连接错误）没有 data，交给 onerror 处理；
    // 这里只处理服务端主动下发的 error 事件（带 data）。
    if (e.data == null) return;
    let msg = "生成失败";
    try { msg = JSON.parse(e.data).message || msg; } catch (_) {}
    addCard("thoughtBody", errHtml(msg));
    logSSE("error", e.data, e.lastEventId);
  });

  // finish 带的是服务端的权威统计（轮次、结束原因）。前端只负责显示。
  es.addEventListener("finish", (e) => {
    try {
      const d = JSON.parse(e.data);
      if (typeof d.rounds === "number") stats.rounds = d.rounds;
    } catch (_) {}
    logSSE("finish", e.data, e.lastEventId);
  });

  es.addEventListener("done", (e) => {
    let payload = {};
    try { payload = JSON.parse(e.data); } catch (_) {}
    if (payload.elapsed_ms) stats.serverMs = payload.elapsed_ms;
    logSSE("done", e.data, e.lastEventId);
    done(payload.error ? "err" : null);
  });

  es.onerror = () => {
    // EventSource 会自动重连（ReadyState=CONNECTING）。只有彻底关闭时才收工。
    if (es.readyState === EventSource.CLOSED && !runFinished) done("err");
  };
}

/* ---------- 面板折叠 ---------- */
document.querySelectorAll(".panel-head").forEach((h) => {
  h.addEventListener("click", (ev) => {
    // 点"显示原始报文"复选框不要触发展开/折叠
    if (ev.target.closest("#rawToggle")) return;
    const body = document.getElementById(h.dataset.body);
    const collapsed = body.classList.toggle("collapsed");
    h.classList.toggle("collapsed", collapsed);
  });
});

/* ---------- 新建 / 刷新 ---------- */
document.getElementById("newRun").onclick = () => {
  if (currentStream) { currentStream.close(); currentStream = null; }
  runFinished = false;
  activeRunId = null;
  resetPanels();
  document.getElementById("qbanner").hidden = true;
  loadRuns();
  goBtn.hidden = false;
  stopBtn.hidden = true;
  setStatus("", "就绪");
  qEl.focus();
};
document.getElementById("refreshRuns").onclick = () => loadRuns();

goBtn.onclick = go;
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });

/* ---------- 停止（打断进行中的诊断） ---------- */
stopBtn.onclick = () => {
  if (!activeRunId) return;
  setStatus("live", "正在停止…");
  stopBtn.disabled = true;
  fetch("/api/diagnose/" + activeRunId + "/cancel", { method: "POST" })
    .catch(() => {})
    .finally(() => { stopBtn.disabled = false; });
};

/* ---------- 启动 ---------- */
loadRuns();
qEl.focus();
</script>
